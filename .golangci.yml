version: "2"

run:
  timeout: 5m
  # No default build-tags here: broker/*.go entry files are mutually
  # exclusive per-tag (each declares GetRootCommand for exactly one
  # broker), so linting all tags at once causes redeclaration errors.
  # CI passes one tag at a time via --build-tags; see lint.yml.

linters:
  default: standard
  enable:
    - misspell
    - revive
    - unconvert
  exclusions:
    rules:
      # cloud.google.com/go/pubsub (v1) and option.WithCredentialsFile are
      # deprecated upstream in favor of pubsub/v2 and workload identity, but
      # migrating is a breaking API change out of scope for a lint cleanup.
      - path: broker/gcppubsub/
        linters:
          - staticcheck
        text: "SA1019"

formatters:
  enable:
    - gofmt
    - goimports
